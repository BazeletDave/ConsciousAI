<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="390" viewBox="0 0 1080 390" role="img" aria-labelledby="title desc"><title id="title">Texas Terafab institutional evidence baseline</title><desc id="desc">Three separately unit-labelled announced or projected metrics, not verified outcomes, from Texas Governor August 6 2026.</desc><rect width="1080" height="390" fill="#101a2b"/><text x="42" y="52" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Texas AI infrastructure | Institutional evidence baseline</text><text x="42" y="81" fill="#afc3da" font-family="Arial,sans-serif" font-size="16">Terafab announcement · August 6, 2026 · Grimes County, Texas</text><g font-family="Arial,sans-serif"><rect x="42" y="112" width="310" height="185" rx="14" fill="#20324a"/><text x="62" y="150" fill="#c7d6e8" font-size="16">Initial capital investment</text><text x="62" y="213" fill="#fff" font-size="43" font-weight="700">&gt; $16.8B</text><text x="62" y="255" fill="#b9cce1" font-size="16">Announced, not verified spent</text><rect x="385" y="112" width="310" height="185" rx="14" fill="#20324a"/><text x="405" y="150" fill="#c7d6e8" font-size="16">Projected employment</text><text x="405" y="213" fill="#fff" font-size="43" font-weight="700">3,000</text><text x="405" y="255" fill="#b9cce1" font-size="16">Projected, not verified hired</text><rect x="728" y="112" width="310" height="185" rx="14" fill="#20324a"/><text x="748" y="150" fill="#c7d6e8" font-size="16">State grant announced</text><text x="748" y="213" fill="#fff" font-size="43" font-weight="700">$30M</text><text x="748" y="255" fill="#b9cce1" font-size="16">Announced, not verified paid</text><text x="42" y="336" fill="#e3edf9" font-size="15">Source: Office of the Texas Governor, August 6, 2026</text><text x="42" y="362" fill="#a9bfd8" font-size="14">GRI AI Paradox · Evidence status: announced/projected · No realized outcomes or causal election effect claimed</text></g></svg>