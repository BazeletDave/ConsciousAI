<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="t d"><title id="t">Tesla SEC 2024 and 2025 companywide financial baseline</title><desc id="d">Two separate comparable year over year bar charts, capital expenditures and gross AI infrastructure property plant and equipment. Companywide figures, not Texas only.</desc><rect width="1080" height="560" fill="#142033"/><g font-family="Arial,sans-serif"><text x="45" y="53" font-size="29" font-weight="bold" fill="white">Tesla | SEC reported financial baseline</text><text x="45" y="82" font-size="16" fill="#b9cbe1">FY2024 vs FY2025 · Companywide · USD billions · Not Texas-only</text><rect x="42" y="114" width="484" height="354" rx="14" fill="#20334d"/><rect x="552" y="114" width="486" height="354" rx="14" fill="#20334d"/><text x="66" y="151" font-size="19" font-weight="bold" fill="white">Annual capital expenditures</text><text x="577" y="151" font-size="19" font-weight="bold" fill="white">Gross AI infrastructure PPE</text><text x="66" y="199" fill="#d6e4f3" font-size="16">2024</text><rect x="142" y="179" width="332" height="34" rx="4" fill="#83a9d4"/><text x="484" y="202" text-anchor="end" fill="#111b29" font-size="17" font-weight="bold">11.34</text><text x="66" y="267" fill="#d6e4f3" font-size="16">2025</text><rect x="142" y="247" width="250" height="34" rx="4" fill="#4fb9a6"/><text x="381" y="270" text-anchor="end" fill="#111b29" font-size="17" font-weight="bold">8.53</text><text x="577" y="199" fill="#d6e4f3" font-size="16">2024</text><rect x="652" y="179" width="243" height="34" rx="4" fill="#83a9d4"/><text x="882" y="202" text-anchor="end" fill="#111b29" font-size="17" font-weight="bold">5.152</text><text x="577" y="267" fill="#d6e4f3" font-size="16">2025</text><rect x="652" y="247" width="321" height="34" rx="4" fill="#4fb9a6"/><text x="961" y="270" text-anchor="end" fill="#111b29" font-size="17" font-weight="bold">6.816</text><text x="66" y="364" fill="#bed0e3" font-size="15">Flow measure: annual investment</text><text x="577" y="364" fill="#bed0e3" font-size="15">Stock measure: gross asset carrying value</text><text x="66" y="400" fill="#bed0e3" font-size="14">Separate scales. Do not combine the series.</text><text x="577" y="400" fill="#bed0e3" font-size="14">Gross PPE change is not cash expenditure.</text><text x="45" y="507" fill="#e2ebf6" font-size="15">Source: Tesla FY2025 Form 10-K, SEC · Values rounded to displayed precision</text><text x="45" y="532" fill="#b9cbe1" font-size="14">GRI AI Paradox | Institutional evidence · Geographic allocation not established</text></g></svg>