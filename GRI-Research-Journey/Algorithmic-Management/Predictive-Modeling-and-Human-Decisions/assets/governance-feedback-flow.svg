<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#f8fafc"/><text x="55" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a" >Figure 4 | Governed feedback loop</text><text x="55" y="92" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#475569" >A learning system requires verified outcomes and managed updates</text><rect x="55" y="135" width="270" height="92" rx="12" fill="#1e40af"/><text x="190" y="174" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Forecast</text><text x="190" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="white" text-anchor="middle">Logged before event</text><rect x="375" y="135" width="270" height="92" rx="12" fill="#1e40af"/><text x="510" y="174" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Human decision</text><text x="510" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="white" text-anchor="middle">Accept / override</text><rect x="695" y="135" width="270" height="92" rx="12" fill="#1e40af"/><text x="830" y="174" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Outcome</text><text x="830" y="202" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="white" text-anchor="middle">Verify independently</text><rect x="55" y="305" width="270" height="92" rx="12" fill="#1e40af"/><text x="190" y="344" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Evaluate</text><text x="190" y="372" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="white" text-anchor="middle">Score and audit</text><rect x="375" y="305" width="270" height="92" rx="12" fill="#0f766e"/><text x="510" y="344" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Approve update</text><text x="510" y="372" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="white" text-anchor="middle">Or retain baseline</text><path d="M325 180H375 M645 180H695 M830 227V270H190V305 M325 352H375" fill="none" stroke="#64748b" stroke-width="4"/><text x="55" y="520" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#475569" >Model weights do not update merely because a chat records a result.</text><text x="55" y="538" fill="#64748b" font-family="Arial" font-size="13">Grand Research Institute • October 2026 • Research protocol</text></svg>