<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" fill="#f8fafc"/><text x="55" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#0f172a" >Figure 2 | Human decision pathways</text><text x="55" y="92" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#475569" >Management behavior is a distinct unit of analysis</text><rect x="330" y="125" width="340" height="75" rx="12" fill="#1d4ed8"/><text x="500" y="171" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white" text-anchor="middle">AI recommendation</text><path d="M500 200V248 M205 248H795 M205 248V300 M500 248V300 M795 248V300" fill="none" stroke="#64748b" stroke-width="4"/><rect x="85" y="300" width="240" height="105" rx="12" fill="#0d9488"/><text x="205" y="342" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white" text-anchor="middle">Accept</text><text x="205" y="373" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="white" text-anchor="middle">Follow recommendation</text><rect x="380" y="300" width="240" height="105" rx="12" fill="#b45309"/><text x="500" y="342" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white" text-anchor="middle">Override</text><text x="500" y="373" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="white" text-anchor="middle">Choose alternative</text><rect x="675" y="300" width="240" height="105" rx="12" fill="#6d28d9"/><text x="795" y="342" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white" text-anchor="middle">Ignore</text><text x="795" y="373" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="white" text-anchor="middle">Do not use advice</text><text x="80" y="468" font-family="Arial, sans-serif" font-size="18" font-weight="normal" fill="#172554" >All decisions are recorded before independent ev