openapi: 3.0.3
info:
  title: GRI Ethical Intelligence Research API
  version: 0.1.0
  description: Research interface supporting the deployed GRI dashboard and local execution. No certification or independent validation is implied.
paths:
  /assurance/overview:
    get:
      summary: Evidence gate assessment and aggregate steward attested benchmark readiness
      responses:
        "200":
          description: Metrics remain null unless a valid reviewed holdout is configured privately
  /assurance/review-queue:
    get:
      summary: Candidate evidence seed manifest with hashes and human review prerequisites
      responses:
        "200":
          description: Seed queue only, not authenticated review workflow state
  /institutional/tiger-assurance:
    get:
      summary: Retained synthetic independent assurance and recovery experiment
      responses:
        '200': {description: Hash checked results and summary; no training or operational promotion}
        '503': {description: Experiment integrity could not be verified}
  /research/catalog:
    get:
      summary: Public GRI research coverage and source links
      parameters:
        - in: query
          name: topic
          schema: {type: string}
      responses:
        '200': {description: Indexed document catalog with explicit coverage and evidence limits}
        '400': {description: Unknown research topic or invalid index}
  /research/ask:
    get:
      summary: Extractive research answers with cited source passages
      parameters:
        - in: query
          name: q
          required: true
          schema: {type: string, maxLength: 800}
        - in: query
          name: topic
          schema: {type: string}
      responses:
        '200': {description: Cited passages or explicit insufficient support result}
        '400': {description: Invalid question topic or index}
  /intelligence/enrollment-research:
    get:
      summary: Reviewed enrollment research, live discovery, adaptive metadata retrieval and study opportunities
      parameters:
        - in: query
          name: q
          schema: {type: string, maxLength: 500}
        - in: query
          name: country
          schema: {type: string, pattern: '^[A-Z]{3}$'}
      responses:
        '200':
          description: Attributed incidents, institutional references, discovery source health, versioned TF IDF metadata model and proposed studies; no fraud probability
        '400':
          description: Invalid query or research snapshot
        '500':
          description: Research data unavailable
  /institutional/research-evolution:
    get:
      summary: Inspect versioned research retrieval and governed learning candidate status
      description: Public repository metadata and suggested relationships. Active production model promotion is never automatic.
      responses:
        '200':
          description: Research catalog, content fingerprints, proposed connections and candidate evaluation gates
  /intelligence/countries:
    get:
      summary: Country evidence, source health and experimental ML topic suggestions
      description: Limited publisher coverage. Political direction and causal impacts require separately reviewed evidence. No political forecasts are generated.
      parameters:
        - in: query
          name: country
          schema:
            type: string
          description: World Bank three letter country or economy code, such as BRA
        - in: query
          name: topic
          schema:
            type: string
            enum: [political_institutions, trade_investment, organizational_management, algorithmic_management, artificial_intelligence, needs_review]
      responses:
        '200':
          description: Filtered metadata candidates, catalog, collection status and model evaluation
        '400':
          description: Invalid topic or snapshot
        '404':
          description: Unknown country code
  /health:
    get:
      summary: Check required local dataset presence and JSON parsing
      responses:
        '200':
          description: Required datasets are readable
        '503':
          description: A required dataset is missing or invalid
    head:
      summary: Return the same readiness status as GET without a response body
      responses:
        '200':
          description: Required datasets are readable
        '503':
          description: A required dataset is missing or invalid
  /health/collections:
    get:
      summary: Inspect local collection timestamps and publisher fetch outcomes
      description: Six hour age threshold with five minute future clock tolerance. Does not control service readiness or establish evidence accuracy.
      responses:
        '200':
          description: Diagnostic report with current or attention_required status
    head:
      summary: Check diagnostic route availability without a response body
      responses:
        '200':
          description: Diagnostic route is available
  /cases:
    get:
      summary: List registered research cases
      responses:
        '200':
          description: Evidence classified case records
  /cases/{caseId}:
    get:
      summary: Retrieve a case with provenance and limitations
      parameters:
        - in: path
          name: caseId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Case record
        '404':
          description: Unknown case
  /assessments:
    post:
      summary: Request a nonbinding evidence completeness assessment
      description: Design only. No automated ethical certification or legal judgment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [case_id]
              properties:
                case_id:
                  type: string
      responses:
        '200':
          description: Proposed assessment and evidence gaps
