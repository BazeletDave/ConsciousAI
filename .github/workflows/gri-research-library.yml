name: GRI Connected Research Library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gri-research-library.yml'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/collect_external_research.py'
  schedule:
    - cron: '11 */6 * * *'
permissions:
  contents: write
concurrency:
  group: gri-connected-research
  cancel-in-progress: false
jobs:
  refresh-public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test public source and question answering boundaries
        run: python -m unittest test_external_research test_unified_research -v
      - name: Refresh public research snapshots
        id: collect
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python collect_external_research.py
      - name: Build and validate the unified research index
        run: |
          python unified_research.py
          python -m unittest test_unified_research -v
      - name: Persist external source snapshots
        working-directory: .
        run: |
          git config user.name "gri-research-library[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/external_research_sources.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh connected public GRI research snapshots"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
            done
            exit 1
          fi
      - name: Surface complete source failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
