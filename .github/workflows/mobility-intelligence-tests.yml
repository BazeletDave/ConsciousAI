name: Mobility Intelligence offline unit tests
on:
  push:
    paths:
      - 'GRI-Research-Journey/Algorithmic-Management-Institutional-Leadership/GRI-Mobility-Intelligence/**'
      - '.github/workflows/mobility-intelligence-tests.yml'
  pull_request:
    paths:
      - 'GRI-Research-Journey/Algorithmic-Management-Institutional-Leadership/GRI-Mobility-Intelligence/**'
      - '.github/workflows/mobility-intelligence-tests.yml'
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic unit tests
        working-directory: GRI-Research-Journey/Algorithmic-Management-Institutional-Leadership/GRI-Mobility-Intelligence
        run: |
          python -m unittest discover -p 'test_*.py' -v
          python mobility_cli.py scenario synthetic_scenario.json
          python mobility_cli.py ledger synthetic_ledger.json
          python mobility_cli.py forecast synthetic_forecast.json
