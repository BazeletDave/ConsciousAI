name: GRI Enrollment Research Discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gri-enrollment-research.yml'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/enrollment_discovery.py'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/enrollment_sources.json'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/operational_health.py'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/test_enrollment_discovery.py'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/test_operational_health.py'
  schedule:
    - cron: '31 */6 * * *'
permissions:
  contents: write
concurrency:
  group: gri-enrollment-research
  cancel-in-progress: false
jobs:
  discover-and-adapt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source boundaries and metadata learning
        run: python -m unittest test_enrollment_discovery test_enrollment_research test_operational_health -v
      - name: Collect sources and adapt retrieval model
        id: collection
        continue-on-error: true
        run: python enrollment_discovery.py
      - name: Validate retained state even when sources fail
        run: python -c "import json; from enrollment_discovery import validate_state, STATE; validate_state(json.loads(STATE.read_text()))"
      - name: Persist collection health and versioned metadata model
        working-directory: .
        run: |
          git config user.name "gri-enrollment-research[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/enrollment_discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh enrollment research discovery and adaptive retrieval"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
            done
            exit 1
          fi
      - name: Publish source collection summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('enrollment_discovery.json').read_text())
          lines = ['## Enrollment collection', '', '| Source | Status | Attempts | Consecutive failed runs | Last success |', '| --- | --- | --- | --- | --- |']
          for s in data['sources']:
              lines.append(f"| {s['source_id']} | {s['status']} | {len(s.get('attempts', []))} | {s.get('consecutive_failures', 0)} | {s.get('last_success_at') or 'none'} |")
          lines.extend(['', 'A successful fetch is not evidence verification. Failed sources remain incomplete coverage.'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(lines) + '\n')
          PY
      - name: Surface incomplete source collection
        if: steps.collection.outcome == 'failure'
        run: exit 1
