name: GRI World Bank WDI evidence validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/world_bank_evidence.yml'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/run_wdi_evidence.py'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/verify_wdi_archive.py'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/world_bank_africa_baseline.py'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/test_world_bank_africa_baseline.py'
permissions:
  contents: read
jobs:
  wdi_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run committed synthetic regression tests
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python -m unittest -v test_world_bank_africa_baseline.py
      - name: Retrieve and reconcile official World Bank WDI observations
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python run_wdi_evidence.py "$RUNNER_TEMP/gri_wdi_evidence"
      - name: Independently verify archived evidence structure and values
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: |
          python -c 'import os,zipfile,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"gri_wdi_evidence"; z=pathlib.Path(os.environ["RUNNER_TEMP"])/"wdi_evidence_check.zip"; zipfile.ZipFile(z,"w",zipfile.ZIP_DEFLATED).write(p/"evidence_manifest.json","evidence_manifest.json"); print(z)'
          python -c 'import os,zipfile,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"gri_wdi_evidence"; z=pathlib.Path(os.environ["RUNNER_TEMP"])/"wdi_evidence_check.zip"; f=zipfile.ZipFile(z,"a",zipfile.ZIP_DEFLATED); [f.write(x,x.relative_to(p)) for x in p.rglob("*") if x.is_file() and x.name!="evidence_manifest.json"]; f.close()'
          python verify_wdi_archive.py "$RUNNER_TEMP/wdi_evidence_check.zip"
      - name: Archive immutable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gri-wdi-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gri_wdi_evidence/
          retention-days: 90
          if-no-files-found: warn
