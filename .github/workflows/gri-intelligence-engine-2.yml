name: GRI Intelligence Engine 2 Research Tests
on:
  pull_request:
    paths:
      - 'GRI-Research-Journey/engineering/**'
      - '.github/workflows/gri-intelligence-engine-2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile research prototype
        run: python -m compileall -q GRI-Research-Journey/engineering
      - name: Run isolated research tests
        working-directory: GRI-Research-Journey/engineering
        run: python -m unittest discover -p 'test_*.py' -v
