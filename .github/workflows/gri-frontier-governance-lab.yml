name: GRI Frontier Governance Lab
on:
  pull_request:
    paths:
      - 'GRI-Research-Journey/Research-Governance/Frontier-Governance-Lab/**'
      - '.github/workflows/gri-frontier-governance-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline governance research tests
        working-directory: GRI-Research-Journey/Research-Governance/Frontier-Governance-Lab
        run: python -m unittest discover -p 'test_*.py' -v
