name: GRI staging evidence validation
on:
  pull_request:
    paths:
      - 'research_tools/**'
      - '.github/workflows/gri-staging-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install encryption dependency
        run: python -m pip install 'cryptography>=42,<47'
      - name: Execute all staging tests
        run: python -m unittest discover -s research_tools -p 'test_*.py' -v
