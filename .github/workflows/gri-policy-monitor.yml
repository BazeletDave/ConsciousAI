name: GRI Official Policy Monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gri-policy-monitor.yml'
      - 'GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/build_assurance_evidence.py'
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: gri-policy-monitor
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ingestion and local service
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python -m unittest discover -v
      - name: Build rights-pending research metadata and holdout manifest
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python build_research_dataset.py
      - name: Ingest official Federal Register metadata
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python ingest_federal_register.py
      - name: Generate governance intelligence review feed
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python intelligence_pipeline.py
      # EU Commission RSS connector verification run; preserve evidence review gates.
      - name: Collect international and mobility feed candidates
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python international_mobility_collector.py
      - name: Produce deterministic assurance evaluation evidence
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python build_assurance_evidence.py
      - name: Verify generated evidence and local HTTP endpoints
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python -m unittest -v test_server.ResearchServiceTests.test_assurance_evidence_integrity_and_classification test_server.ResearchServiceTests.test_governance_telemetry_fails_closed_without_source test_server.ResearchServiceTests.test_health_endpoint
      - name: Commit updated review queue
        run: |
          git config user.name "gri-policy-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/assurance_evidence_snapshot.json
          git add GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/research_dataset/candidate_metadata.json GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/research_dataset/manifest.json GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/policy_candidates.json GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/intelligence_feed.json GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/international_mobility_feed.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official Federal Register policy review queue"
            # A concurrent README or research commit can advance main during collection.
            # Rebase only this generated-data commit; fail closed on conflicting edits.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
            done
            echo "Unable to publish review queue after three attempts" >&2
            exit 1
          fi
