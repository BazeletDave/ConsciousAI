name: GRI Official Policy Monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gri-policy-monitor.yml'
  schedule:
    - cron: '17 */3 * * *'
permissions:
  contents: write
concurrency:
  group: gri-policy-monitor
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test ingestion and local service
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python -m unittest discover -v
      - name: Ingest official Federal Register metadata
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python ingest_federal_register.py
      - name: Generate governance intelligence review feed
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python intelligence_pipeline.py
      # Connector validation run: official-index discovery and evidence integrity checks.
      - name: Collect international and mobility feed candidates
        working-directory: GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems
        run: python international_mobility_collector.py
      - name: Commit updated review queue
        run: |
          git config user.name "gri-policy-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/policy_candidates.json GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/intelligence_feed.json GRI-Research-Journey/Research-Governance/ConsciousAI-Research-Systems/international_mobility_feed.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official Federal Register policy review queue"
            git push
          fi
